site_name: Claudio's project portfolio
site_url: https://grimhope.github.io/portfolio/
site_description: Documentation and demos of university, thesis, work and personal projects.
repo_url: https://github.com/GrimHope
repo_name: GrimHope on GitHub
edit_uri: ""

theme:
  name: material
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.suggest
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Light mode

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - i18n:
      docs_structure: suffix          # page.md (English) + page.it.md (Italian)
      fallback_to_default: true       # pages without an Italian copy show in English
      reconfigure_material: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: it
          name: Italiano
          build: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Projects: projects/index.md
  - About: about.md
